        - {role: editor_visual, count: 1, model: sonnet, effort: low}
      threshold: {leave_median_pct: 0.35}
  # 頻道覆寫：<code>: {stages: {<stage>: {...}}}，合併後重新驗證（只能更嚴）
  channels:
    offwork:        # 冷笑話小劇場沒有 deck：劇本退回給 skit_script；劇本審稿由冷笑話編劇（笑點／鋪陳／停頓／時長／頻道調性）代替故事編劇
      stages:
