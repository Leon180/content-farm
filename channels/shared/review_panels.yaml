pros:
  editor:
    title: 專業剪輯
    brief: >-
      你是有十年經驗的 YouTube 知識類長片剪輯師。只看節奏與畫面：換場頻率、靜止畫面、轉場髒不髒、
      畫面與旁白同步、素材是否貼題、字幕可讀性（不評聲音）。
    rubric: [節奏與換場, 畫面與旁白同步, 素材貼題, 字幕與版面]
  director:
    title: 專業導演
    brief: >-
      你是知識類節目導演。看整體敘事：開場鉤子與承諾、章節結構、每段是否推進論點、re-hook、角色（主持角色）使用、
      語氣一致性、結尾收束與下集預告；指出觀眾會在哪裡失去方向。
    rubric: [開場與承諾, 結構與推進, 角色與語氣, 收尾]
  writer:
    title: 專業編劇
    brief: >-
      你是科普節目編劇。看講稿：比喻是否先於定義、每 10 秒是否有讓人想聽下去的東西、名詞密度、
      笑點與八卦是否自然、有沒有灌水句。
    rubric: [比喻與定義, 節拍密度, 名詞密度, 幽默與八卦, 精簡度]

stages:
  rough_cut:          # 初剪：觀眾 ×5 ＋剪輯 ＋導演（編劇可選）
    viewers: 5
    holdout: false
    pros: {editor: 1, director: 1, writer: 0}
    homepage: true
  final:              # 成片／最後一輪：加 holdout 觀眾
    viewers: 5
    holdout: true
    pros: {editor: 1, director: 1, writer: 1}
    homepage: true
  shorts:             # Shorts：客觀指標 ＋ 2 位觀眾
    viewers: 2
    holdout: false
    pros: {}
    homepage: false

thresholds:            # Leon 2026-10-17 先用這組（另定再改）
  leave_median_pct: 0.5        # 合成觀眾離開時間中位數 ≥ 片長 50%
  click_mean: 7.0              # 平均點擊意願 ≥ 7/10
  objective_all_green: true    # 死區 0、節拍最大間隔 ≤10 s、最長靜止 ≤8 s、首個鉤子 ≤15 s
  homepage_noticed_median: 3   # 首頁情境：被注意名次中位 ≤ 3
  homepage_pick_factor: 2.0    # 被選比例 ≥ 2/N（N＝首頁張數）
  max_rounds: 3

# ─────────────────────────────────────────────────────────────────────────────
# 句子 id 欄位：由 feat/incremental-render 定義；未定前，deck 沒有此欄位時用「<slide id>.<序號>」（不穩定，僅供指認）
sentence_id_field: sentence_ids   # feat/incremental-render ec2c126: slide.sentence_ids, one per split_sentences(narration)

# 每支片的評審流程（Leon 2026-10-17 決策 e0ac3ac36faf；設計稿 claude.ai/artifact/Q6ug8VB3rWc6fBLtorKi6r）
# 由 src/content_farm/review/config.py 驗證；硬規則（必要角色、事實查核 opus·high、門檻下限、輪數上限）寫在程式裡，
# 這裡只能「更嚴」不能「更鬆」。每位評審是 pipeline 自己啟動的 `claude -p --model --effort --json-schema` 子程序。
review:
  # Leon 2026-10-23。score_only：非事實關評一次、記分數與意見，不擋、不退回、不改稿（選題仍依分數取最高）；分數寫進
  # review/score_ledger.json，views／留存／CTR 欄位待上片後填。fact_on_fail（決策 a53960fc4b1d＝A）：article／script_facts／media
  # 查一次，確認錯的句子自動刪或改成有出處的說法（不新增）、授權有問題的素材自動換掉、不重查、往下走，錯誤與修法記進
  # review/auto_fix.jsonl；stop＝照下面各關的輪數與門檻，沒過就停。
  # Leon 2026-10-24（v4）：只留兩種評審——腳本評審（觀眾＋編劇，評一次，照意見自動改稿一次、不重評、不擋：script_revise_once）與
  # 正確性查核（信心度 ≥ 0.5 才算錯誤，review/confidence.py；< 0.5 只記錄）。其他關各自 `enabled: false`（title_thumb／media／final／
  # shorts_title／shorts_final，要開回就改成 true）；選題評分保留作排序、不當閘門。授權（media 關）改走程式規則 review/license_rules.py。
  policy: {score_only: true, script_revise_once: true, fact_on_fail: auto_fix_then_pass}
  defaults: {max_parallel: 8, timeout_s: 1200, schema_retries: 1}   # 2026-10-19 4→8；入場檢查仍依可用記憶體往下調
  license_rules:       # 授權程式規則（review/license_rules.py）：素材來源白名單；AI 圖另查標示（AI 示意圖）與 model／prompt／seed
    allowed_kinds: [ai_image, artwork, stock, stock_video, wikimedia, news_card, title_card, parallax, wan, article, discussion]
  budget: {usd_per_video: 15}                  # 雲端車道（評審＋產出 agent）每支片的名目上限；用完就停下回報，不自動繼續（review/budget.py）
  aggregator: {model: haiku, effort: low}      # 修改清單整理、退回路由、彙整
  roles:
    viewer: {title: 合成觀眾, kind: viewer}
    writer_story:
      title: 編劇（故事）
      kind: pro
      brief: >-
        你是科普節目編劇，偏重故事：開場 15 秒內有沒有鉤子與承諾、每 5–10 秒有沒有留人的點（問題、反轉、數字揭曉、八卦、冷笑話）、
        艱深名詞是否先用國高中程度的比喻再給定義、八卦是否有來源、冷笑話節拍是否自然、結尾是否回扣開場。
      rubric: [十五秒鉤子, 留人點密度, 國高中比喻, 八卦與冷笑話節拍, 收尾回扣]
    writer_density:
      title: 編劇（資訊密度）
      kind: pro
      brief: >-
        你是科普節目編劇，偏重資訊密度：內容撐不撐得起片長、有沒有灌水句或重講、一段是否丟太多數字、名詞密度、
        論點是否一路推進、每個數字是否有單位與基準。
      rubric: [內容撐得起片長, 無灌水重講, 數字密度與單位, 名詞密度, 論點推進]
    director:
      title: 導演
      kind: pro
      brief: >-
        你是知識類節目導演：整體敘事、分鏡畫不畫得出來、畫面會不會停太久、畫面有沒有幫講稿說話、主持角色使用、結尾收束。
      rubric: [敘事結構, 分鏡可行, 畫面節奏, 角色與語氣]
    fact_checker:
      title: 事實查核
      kind: fact
      tools: [Read, WebFetch, WebSearch]
      brief: >-
        你是事實查核員。逐條找出稿中每個數字、日期、引述、因果說法與八卦，回到 sources.json 的原始網址查證（用 WebFetch），
        不要相信稿子或文章的轉述。不參考其他查核員。
    producer:
      title: 製作人
      kind: producer
      brief: >-
        你是頻道製作人：題目與頻道合不合、跟頻道既有片有沒有重複、來源夠不夠；標題與縮圖有沒有誇大、跟內容一致嗎、
        有沒有投資建議或聳動用語。
    designer:
      title: 縮圖設計師
      kind: designer
      brief: >-
        你是 YouTube 縮圖設計師：縮到手機首頁大小（168 px 寬）後字讀不讀得到、對比、構圖、主體大小、角色表情、三款是否真的不同。
      rubric: [小尺寸可讀, 對比, 構圖與主體, 三款差異]
    compliance:
      title: 合規審查
      kind: compliance
      brief: >-
        你是素材合規審查：每張素材有沒有可讀的公司名或 logo、有沒有像真人或官方角色、授權是否可營利（credits.json）。
    editor_visual:
      title: 剪輯（畫面）
      kind: pro
      brief: >-
        你是十年經驗的知識類長片剪輯師，只看畫面：換場頻率、靜止畫面、轉場、畫面與旁白同步、素材貼題、字幕可讀、縮圖與影片一致。
      rubric: [節奏與換場, 畫面與旁白同步, 素材貼題, 字幕與版面]
    writer_comedy:
      title: 編劇（冷笑話）
      kind: pro
      brief: >-
        你是冷笑話與短劇編劇，審的是一支 20–50 秒、由一隻飲水機金魚演出的直式 Short 劇本：鋪陳（1–3 場）→ 停頓約 0.6 秒（記在最後一場
        鋪陳的 transition）→ 笑點（單句、短）→ 可省的收尾。要判斷：笑點有沒有真的翻轉鋪陳建立的預期、鋪陳有沒有提前洩漏或太長、
        停頓放的位置對不對（笑點之前，不是之後）、全片長度是否落在 20–50 秒（約 5.5 字／秒加停頓）、有沒有解釋笑點或重複笑點、
        是否原創（看起來像常見段子或其他頻道的口頭禪就扣分）、是否符合頻道調性（下班族的冷面幽默、口語、不爆粗、不拿真實公司或個人開刀、
        不用過期流行語如「狂」「絕了」、「欸」不超過一次）、角色只有頻道設定裡的金魚。不要評音效與配樂（後期才加）。
      rubric: [笑點, 鋪陳, 停頓, 時長, 頻道調性]
  stages:
    topic:
      gate: topic
      reviews: [topics/candidates.json]
      producer: {model: opus, effort: medium}
      rework: topic
      max_rounds: 2
      seats:
        - {role: viewer, count: 3, model: sonnet, effort: low}
        - {role: writer_story, count: 1, model: sonnet, effort: low}
        - {role: producer, count: 1, model: sonnet, effort: low}
      threshold: {top_n_long: 1, top_n_short: 3, topic_min_score: 6.0}
    article:
      gate: article
      reviews: [article.md, sources.json]
      producer: {model: sonnet, effort: low}
      arbiter: {model: sonnet, effort: medium}   # Leon 59fdefb32bd7=D：兩位查核不一致交第 3 位仲裁
      rework: article
      max_rounds: 3                          # 59fdefb32bd7=D：2→3；第 2 輪起只准刪改（程式比對，review/article_diff.py）
      seats:
        - {role: fact_checker, count: 2, model: sonnet, effort: medium}
      threshold: {fact_errors_max: 0}
    # 腳本拆兩段（Leon 7afa95870a4e＝A）：結構段可大改、事實只列不擋；過了才進事實段（只准刪改、仲裁、0 錯）。
    # 事實段過了＝事實鎖定：之後改講稿只准刪改；新寫句子會讓結構段的核可失效，重新走兩段。
    script_structure:
      gate: deck
      reviews: [deck.json, slides/contact_sheet.png]
      producer: {model: sonnet, effort: low}
      rework: deck
      max_rounds: 3
      seats:
        - {role: viewer, count: 5, holdout: 1, model: sonnet, effort: low}
        - {role: writer_story, count: 1, model: sonnet, effort: low}
        - {role: writer_density, count: 1, model: sonnet, effort: low}
      threshold: {leave_median_pct: 0.35, writer_min: 6.0}   # Leon 80bd30689ee7=C: 7 → 6.5；2026-10-23 校正成 sonnet 尺度（writer 6.5→6.0、觀眾 0.40→0.35），見 REPORT-story-calibrate.md
    script_facts:
      gate: deck_facts
      reviews: [deck.json]
      arbiter: {model: sonnet, effort: medium}
      rework: deck
      max_rounds: 3
      seats:
        - {role: fact_checker, count: 2, model: sonnet, effort: medium}
      threshold: {fact_errors_max: 0}
    title_thumb:
      enabled: false      # Leon 2026-10-24：評審關閉（程式規則取代／不評分）
      gate: title
      reviews: [titles.json, thumbnail.json, thumbnail_variants.json, thumbnails/variant_*.jpg]
      producer: {model: sonnet, effort: low}
      rework: thumbnail_spec
      max_rounds: 3
      seats:
        - {role: viewer, count: 5, model: sonnet, effort: low}
        - {role: designer, count: 1, model: sonnet, effort: low}
        - {role: producer, count: 1, model: sonnet, effort: low}
      threshold: {noticed_median_max: 3, pick_factor: 2.0, auto_checks: true, producer_honest: true}   # 競品色相差只列出不擋（Leon 31134b307b3e=A；hue_blocks 預設 false）
    media:
      enabled: false      # Leon 2026-10-24：評審關閉（程式規則取代／不評分）
      gate: media
      reviews: [media/media_report.json, credits.json, media/contact_sheet.png, assets/ai_images/*]
      rework: media
      max_rounds: 3
      seats:
        - {role: compliance, count: 1, model: sonnet, effort: low}
      threshold: {compliance_issues_max: 0, licenses_confirmed: true}
    final:
      enabled: false      # Leon 2026-10-24：評審關閉（程式規則取代／不評分）
      gate: final
      reviews: [assembly/release.mp4, assembly/final.mp4, qc/qc_report.json, thumbnails/variant_*.jpg]
      rework: assembly
      max_rounds: 3
      seats:
        - {role: viewer, count: 5, holdout: 1, model: sonnet, effort: low}
        - {role: editor_visual, count: 1, model: sonnet, effort: low}
        - {role: director, count: 1, model: sonnet, effort: low}
      threshold: {leave_median_pct: 0.35, objective_all_green: true, thumbnail_consistent: true}
    shorts_topic:
      gate: topic
      reviews: [topics/candidates.json]
      producer: {model: sonnet, effort: low}
      rework: topic
      max_rounds: 1
      seats:
        - {role: viewer, count: 3, model: sonnet, effort: low}
      threshold: {top_n_long: 0, top_n_short: 3}
    shorts_script:
      gate: script
      reviews: [script.json]
      producer: {model: sonnet, effort: low}
      rework: deck
      max_rounds: 3
      seats:
        - {role: viewer, count: 3, model: sonnet, effort: low}
        - {role: writer_story, count: 1, model: sonnet, effort: low}
      threshold: {leave_median_pct: 0.35, writer_min: 6.5}   # Leon 80bd30689ee7=C: 7 → 6.5
    shorts_title:
      enabled: false      # Leon 2026-10-24：評審關閉（程式規則取代／不評分）
      gate: title
      reviews: [titles.json, thumbnails/variant_*.jpg]
      rework: thumbnail_spec
      max_rounds: 3
      seats:
        - {role: viewer, count: 3, model: sonnet, effort: low}
    shorts_final:
      enabled: false      # Leon 2026-10-24：評審關閉（程式規則取代／不評分）
      gate: final
      reviews: [assembly/final.mp4, qc/qc_report.json]
      rework: assembly
      max_rounds: 3
      seats:
