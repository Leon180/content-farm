# 念稿發音表 — 只改送進 TTS 的文字，字幕和畫面照講稿原文。
#
# 合併順序（後者覆蓋前者）：shared → providers.<provider> → channels.<code> → script.json 的 pronunciation_map
# key 是講稿裡的寫法，value 是送進 TTS 的寫法。依序做字串取代，所以長詞放前面。
# 每一條都要寫來源（哪次試聽／哪個 ASR 結果），不要憑感覺加：加錯會把念對的念錯。
#
# key_terms：自動念錯檢查（voice.speech_check）會確認這些詞在 whisper 轉回的文字裡聽得到；
#   出現在該段講稿、但轉回文字裡找不到 display／spoken／heard_as 任何一個 → 該段重生。
#   heard_as 是「念對了但 whisper 寫成別的字」的寫法（同音字），不是錯誤念法。

shared: {}

providers:
  voxcpm2:
    # 2026-10-17 本機試驗（VoxCPM2-8bit、妖怪參考聲，seed 1/2 皆同；ASR whisper-large-v3-turbo）
    蘆葦: 盧偉      # 原文「掃過蘆葦」→ 轉回「走過療戶／寥戶」；改「盧偉」後轉回「蘆葦」
    掃過: 嫂過      # 「掃過」→ 轉回「走過」；改「嫂過」後轉回「掃過」
    霧: 務          # 「霧裡」→ 轉回「母裏／牡蠣」；改「務」後轉回「霧裏」
    CoWoS: 扣窩斯   # 原樣念成「Cosal Girls／Coors」；試驗報告：CoWoS 全部念錯。「扣窩斯」轉回「扣窩絲／扣沃斯」（同音）
    輝達: 揮達      # 2026-10-17 CoWoS v3：原樣 4 段被 whisper 轉回「凱達／提達／可以答」，合成觀眾 5 位中 3 位點名念錯（依念錯政策修）；改送同音「揮達」
    CoPoS: 扣破斯   # CoWoS（channel-voices）s22 用 deck 對照「扣破斯」，whisper 轉回「扣破絲」＝同音念對；v3 講稿已不念 CoPoS，未再驗
    # 2026-10-24 寓言學堂（fable-ref 參考聲；ASR whisper-large-v3-turbo；scripts/pronunciation_trial.py，每句 2–3 個 seed）
    # 鷹 yīng：原樣 → 轉回「貓頭七」（2 seed）、「鷹鴿」→「車歌／戳戈」「是鷹」→「是七」。候選：英→轉回「貓頭鷹」2/2、「英歌博弈」「是英」；
    #   嬰→迎／銀；鶯→尹／鷹 1/2。取「英」。要用 2 字以上的詞當 key：回讀對照（speech_check.build_aliases）略過單字，避免「英國」被改成「鷹國」
    貓頭鷹: 貓頭英
    # 鴿 gē 也被念歪（寓言學堂中片 scene_016：「英鴿博弈」→「英之博弈」、「是鴿」→「是獅」，重生 3 次不變）；試驗「英歌博弈」轉回「英歌博弈」
    鷹鴿: 英歌
    派是鷹: 派是英
    派是鴿: 派是歌
    # 鳥 niǎo：同音字替換都不理想（原樣念成球／酒／油；裊嫋嬝褭蔦念成別的音；尿 niào 回讀 6/6 但聲調差一聲，Leon 2026-10-25 回饋「鳥還是唸錯」，要求不要用同音字替換）
    #   → 不替換。講稿避開單獨的「鳥」字，改用具體名稱（山雀、小山雀、貓頭鷹…）；鳥 仍是 key term，講稿再寫到會被回讀檢查抓到
  qwen3_tts:
    # 2026-10-17 本機試驗（Qwen3-TTS Base、下班了參考聲）
    員工: 原工      # 原文「員工」→ 轉回「雲共／雲供」；改「原工」後兩個 seed 都轉回「員工」
    蘆葦: 盧偉      # 「蘆葦」→ 轉回「君空／雲餐」
    CoWoS: 扣窩斯   # 「COWOS」seed 1 轉回「Coke OS」；「扣窩斯」轉回「扣沃斯／扣國斯」
  fish_audio: {}    # 晶片貓 Fish：先不改，看 speech_check 結果再加

channels: {}

key_terms:
  - display: CoWoS
    heard_as: [cowos, 扣窩斯, 扣窩絲, 扣沃斯, 扣握斯, coworse]
  - display: CoPoS    # 2026-10-17 CoWoS（channel-voices）s22：deck 送「扣破斯」，whisper 轉回「扣破絲」（同音，非念錯）
    heard_as: [copos, 扣破斯, 扣破絲, 扣坡斯]
  - display: TSMC
    heard_as: [tsmc]
  - display: HBM
    heard_as: [hbm]
  - display: 台積電
    heard_as: [臺積電, 台積電]
  - display: 輝達
    heard_as: [輝達, nvidia]
  # 外文專名：whisper 常把念對的英文寫成中文譯名（2026-10-17 cel s16/s17）
  - display: GAINAX
    heard_as: [蓋納克斯, 蓋那克斯, 蓋納斯, gainax]
  - display: Netflix
    heard_as: [網飛, 奈飛, 網路飛, netflix]
  - display: MAPPA
    heard_as: [馬帕, 瑪帕, mappa]
  - display: 中介層
  - display: 九尾狐   # 湖／糊／胡 與 狐 同音（hú），2026-10-17 九尾狐 s02/s04 whisper 轉回「九尾湖」「九尾糊」
    heard_as: [九尾湖, 九尾糊, 九尾胡, 九尾壺]
  # 2026-10-24 鳥／鷹 被念成「七／球／酒」，但單字錯只佔 CER 0.02–0.03，過不了 0.12 門檻也不是 key term → 沒被抓到。
  # 現在列為 key term（逐次計數：講稿出現幾次，回讀要聽到幾次）
  - display: 鳥
  - display: 鷹
  - display: 員工
  - display: 蘆葦
  - display: 製作委員會
