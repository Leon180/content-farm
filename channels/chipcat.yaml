# 晶片貓 — 台灣科技產業拆解（長片主力）
# Secrets never go here: the youtube block only names env vars.
code: chipcat
name: 晶片貓
line: 台灣科技產業拆解
pipeline: explainer
brand: chipcat
deck_category: tech
mascot:
  name: 晶片貓（本尊）
  ref: chipcat          # explainer/mascot 的角色 id；造型由 mascot 模組負責
  rig_ready: true
voice:
  provider: fish_audio
  voice_id_env: CF_CHIPCAT_VOICE_ID
topic_categories: [半導體, 電子供應鏈, AI 硬體, 能源與電力, 科技公司財報]
format:
  length: long
  aspect: "16:9"
  target_seconds: [420, 660]
cadence:
  long_per_week: 1        # 提案預設；待 Leon 決定
  shorts_per_week: 2      # 「一個數字」Shorts，由長片切出
  publish_days: [thu]
  shorts_days: [sat, tue]
  lead_days: 7
  publish_time: "19:00"
  timezone: Asia/Taipei
shorts_strategy: 一個數字：從長片挑一張 big_number 投影片，45 秒直式重講，導流長片
media:
  stock: true
  ai_image: true
  artwork: false
  source_footage: false
ai_illustration:          # Leon 2026-10-16 cc801e14fbc2：預設 FLUX.2 klein 4B
  provider: local_mflux
  model: flux2-klein-4b
  style_prefix: >-
    Clean flat editorial illustration of technology and industry, simple shapes, navy and gold accents,
    illustration, not a photograph, no text, no logos.
  seed: 42
  width: 1280
  height: 720
gates: [article, deck, media, final]
youtube:
  client_id_env: CF_YOUTUBE_CLIENT_ID          # 共用 OAuth client
  client_secret_env: CF_YOUTUBE_CLIENT_SECRET
  refresh_token_env: CF_YT_CHIPCAT_REFRESH_TOKEN  # 以該頻道身分跑 get_youtube_token.py 取得
  channel_id_env: CF_YT_CHIPCAT_CHANNEL_ID
  ai_disclosure: true
  default_privacy: private
notes:
  - 不給投資建議；財報數字一律附來源
  - 八卦必須有來源
series:
  hn:                     # HN 中文版（production/news；produce.py news daily|weekly）
    name: 晶片貓 HN 快報
    playlist: 晶片貓｜HN 快報
    sources: [hn, lobsters, arxiv]   # 免費來源；不接 X、不爬網頁轉貼
    max_age_hours: 48
    review_candidates: 15            # 審核頁列幾則（每則都先讀過原文）
    daily_shorts: [1, 2]             # 每天挑 1–2 則
    shorts_time: "12:30"             # 每日 Short 預設排程
    weekly:
      items: [3, 5]                  # 當週 Shorts 中最重要的 3–5 則，一則一章
      target_seconds: [420, 660]     # 6–11 分；內容撐得起就 ≥ 480（8:00，可插 mid-roll）
      publish_day: sat
      publish_time: "10:00"
    rank_weights: {popularity: 0.55, relevance: 0.45, comments: 0.6}
