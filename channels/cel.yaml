# 賽璐璐研究室 — 動畫產業拆解（不用原片）
code: cel
name: 賽璐璐研究室
line: 動畫產業拆解
pipeline: explainer
brand: cel
deck_category: knowledge
mascot:
  name: 格仔（底片格身體、鉛筆呆毛）
  ref: cel-frame          # 新角色，rig 尚未製作；未完成前跳過 mascot 疊加
  rig_ready: false
voice:                    # Leon 2026-10-17：本機 VoxCPM2（Apache-2.0）複製參考聲
  provider: voxcpm2
  tempo: 1.12             # Leon 2026-10-17 944769e1fc01（音高不變）
  reference:
    audio: ~/.local/share/content-farm-voices/cel-take0.wav
    text: 大家好，歡迎來到賽璐璐研究室。今天我們要用三張圖表，看懂一部動畫從企劃到播出的資金流向。第一，誰出錢；第二，誰承擔風險；第三，最後的收益又是怎麼分配的。把這三件事搞清楚，你就會明白為什麼有些作品叫好卻不叫座。
    note: 本機試驗 2026-10 的 cel take0（trial-scripts/common.py REF_PICK）
topic_categories: [製作委員會與錢, 動畫師勞動與薪資, 外包與海外產線, 串流與授權生意, 業界歷史事件]
format:
  length: long
  aspect: "16:9"
  target_seconds: [420, 600]   # Leon 2026-10-16：長片 7–10 分鐘
  goal_seconds: 480            # 內容撐得起就做到 8:00 以上（mid-roll 門檻），不灌水；QC 低於此值 warn
cadence:
  long_per_week: 0.5
  shorts_per_week: 1
  publish_days: [sun]
  shorts_days: [thu]
  lead_days: 10
  publish_time: "20:00"
  timezone: Asia/Taipei
shorts_strategy: 一格一數字：一個產業數字（例如一集預算）配攝影表式比較，導流長片
media:
  stock: true             # 只限辦公室、手繪桌等通用畫面
  ai_image: true          # 不得畫出近似官方角色的圖
  artwork: false
  source_footage: false   # 不用原片、PV、截圖（2026-07 美國法院判決；Content ID）
ai_illustration:          # Leon 2026-10-16 cc801e14fbc2：預設 FLUX.2 klein 4B；不得畫出近似官方角色的圖
  provider: local_mflux
  model: flux2-klein-4b
  style_prefix: >-
    Simple hand-drawn editorial illustration of an animation studio workplace, original generic characters only,
    soft colours, illustration, not a photograph, no text, no logos.
  seed: 42
  width: 1280
  height: 720
gates: [article, deck, media, final]
youtube:
  refresh_token_env: CF_YT_CEL_REFRESH_TOKEN
  channel_id_env: CF_YT_CEL_CHANNEL_ID
  ai_disclosure: true
  default_privacy: private
identity:   # 政策審查 2026-10 D3：不得與晶片貓共用開場句、說明欄句型、片尾（QC 會比對）
  opening:
    format: 場記板式開場：CUT 01 並排兩則互相矛盾的同年新聞，報上頻道名，說明這一集要對哪一筆帳；不報投影片張數
    signature: 這裡是賽璐璐研究室
  take_label: 研究室的看法
  outro:
    signature: 這卷帳本先對到這裡
    endcard: 下一卷帳本見
  description:
    header: "【賽璐璐研究室・產業帳本】{title}"
    sources_label: 帳本出處（協會報告、財報、官方調查）：
    footer: 本片不使用任何動畫原片、PV 或截圖；作品名稱僅作產業討論，不構成投資建議。
notes:
  - 講產業結構，不複述劇情
  - 作品名稱可提，但畫面不放官方角色、截圖或近似 AI 圖
