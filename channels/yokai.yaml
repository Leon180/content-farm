# 妖怪溯源所 — 神話・怪物溯源（東亞比較考據）
code: yokai
name: 妖怪溯源所
line: 神話・怪物溯源
pipeline: explainer
brand: yokai
deck_category: knowledge   # 之後加 myth category 再換
mascot:
  name: 青蛙書記           # Leon 2026-10-17 選定第二輪 Y14 平面版（AI 生成角色，PNGtuber）
  ref: pngtuber/frog-scribe
  host: pngtuber
  rig_ready: true
voice:                  # Leon 2026-10-17：本機 VoxCPM2（Apache-2.0）複製參考聲
  provider: voxcpm2
  tempo: 1.20             # Leon 2026-10-17 944769e1fc01：參考聲語速慢，整片加速（音高不變）
  reference:
    audio: ~/.local/share/content-farm-voices/yokai-take1.wav
    text: 很久很久以前，在一座沒有名字的山裡，住著一位老獵人。每到黃昏，他都會聽見林子深處，傳來像是有人在哼歌的聲音。他從來不敢回頭看。因為村裡的老人說過，回頭的人，就再也走不出那座山了。
    note: 本機試驗 2026-10 的 yokai take1（trial-scripts/common.py REF_PICK）
topic_categories: [山海經異獸, 日本妖怪, 台灣魔神仔與民間傳說, 台灣信仰的來歷, 世界比較神話]
format:
  length: long
  aspect: "16:9"
  target_seconds: [420, 600]   # Leon 2026-10-16：長片 7–10 分鐘
  goal_seconds: 480            # 內容撐得起就做到 8:00 以上（mid-roll 門檻），不灌水；QC 低於此值 warn
cadence:
  long_per_week: 0.5      # 隔週一支：考據＋artwork 授權審核最花人工
  shorts_per_week: 1      # 一分鐘妖怪圖鑑卡，只當導流
  publish_days: [sat]
  shorts_days: [wed]
  lead_days: 14           # 考據＋artwork 授權確認
  publish_time: "20:00"
  timezone: Asia/Taipei
shorts_strategy: 一分鐘妖怪圖鑑：一隻妖怪一張卡（出處、年代、長相演變），導流長片
media:
  stock: false            # 沒有適合的 stock；畫面靠 artwork＋非擬真 AI 水墨
  ai_image: true
  artwork: true           # Met／AIC／Rijksmuseum 等 CC0；大英博物館 NC 不可用
  artwork_license_required: true
  source_footage: false
ai_illustration:          # Leon 2026-10-16 cc801e14fbc2：妖怪溯源所用 Z-Image 水墨風
  provider: local_mflux
  model: z-image-turbo
  style_prefix: >-
    Traditional East Asian ink wash painting on aged rice paper, loose expressive brush strokes,
    muted grey ink with light colour washes, illustration, not a photograph, no text, no seal.
  seed: 42
  width: 1280
  height: 720
gates: [topic, article, deck, title, media, final]   # 全部由評審團核可（review_panels.yaml），不可關
youtube:
  refresh_token_env: CF_YT_YOKAI_REFRESH_TOKEN
  channel_id_env: CF_YT_YOKAI_CHANNEL_ID
  ai_disclosure: true
  default_privacy: private
identity:   # 政策審查 2026-10 D3：開場、說明欄、片尾各頻道不同（QC 會比對）
  opening:
    format: 「你以為 vs 原典」開場：先講大眾熟悉的形象，再翻出最早的原典記載製造反差，接著列出這集的停靠站
    signature: 最早的原典
  take_label: 溯源所的解讀
  outro:
    signature: 妖怪溯源所
    endcard: 下一隻妖怪，繼續溯源
  description:
    header: "【妖怪溯源所・原典追蹤】{title}"
    sources_label: 原典與參考文獻：
    footer: 原典引自公共領域版本，白話為頻道自寫；片中畫作皆為公共領域或 CC0。
notes:
  - 讀原典自己寫；現代白話譯注另有著作權，不可照抄
  - 媽祖、城隍等講「來歷」，不稱神話、不嘲諷、不生成神像
  - 原住民族題材只走共製路線，不進這條自動 pipeline
