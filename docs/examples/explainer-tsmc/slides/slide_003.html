<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>s03 · 自己蓋廠 vs 找人代工</title>
<style>
/*
 * Explainer slide frame — 1920x1080, shared by every theme.
 *
 * Vertical budget (px):
 *     0 –  96  top bar (series title / section / page)
 *   112 – 820  .content  — the only place layouts draw; overflow is checked here
 *   832 – 872  .meta     — sources, "資料截至", disclaimer
 *   880 – 1080 subtitle safe zone — burned ASS subtitles (bottom-centre,
 *              MarginV 80, 52pt, <= 2 lines) live here; nothing else may enter
 * Mascot slot: bottom-right corner, x >= 1592, y >= 826. Subtitles are
 * centred and <= ~1250px wide (24 chars x 52pt), so they never reach it.
 */
:root {
  --stage-w: 1920px;
  --stage-h: 1080px;
  --safe-top: 880px;
  --pad-x: 120px;
  --font-sans: "Noto Sans CJK TC", "PingFang TC", "Heiti TC", sans-serif;
  --font-mono: "SF Mono", "Menlo", "Noto Sans CJK TC", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--stage-w); height: var(--stage-h); overflow: hidden; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body, var(--font-sans));
  -webkit-font-smoothing: antialiased;
}
.stage { position: relative; width: var(--stage-w); height: var(--stage-h); overflow: hidden; }

.topbar {
  position: absolute; top: 0; left: 0; right: 0; height: 96px;
  display: flex; align-items: center; gap: 24px; padding: 0 var(--pad-x);
  font-size: 26px; color: var(--muted); border-bottom: 2px solid var(--rule);
}
.topbar .series { font-weight: 700; color: var(--accent); white-space: nowrap; }
.topbar .section { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .pageno { font-family: var(--font-mono); }

.content {
  position: absolute; top: 112px; left: var(--pad-x); right: var(--pad-x);
  height: 708px; overflow: hidden;
  display: flex; flex-direction: column;
}
.heading {
  font-family: var(--font-heading, var(--font-sans));
  font-size: 64px; font-weight: 900; line-height: 1.2; letter-spacing: 0.01em;
  margin-bottom: 40px;
}
.heading::after {
  content: ""; display: block; width: 120px; height: 8px; margin-top: 20px;
  background: var(--accent); border-radius: 4px;
}

.meta {
  position: absolute; top: 832px; left: var(--pad-x); width: 1400px; height: 40px;
  display: flex; align-items: center; gap: 28px;
  font-size: 22px; color: var(--muted); white-space: nowrap; overflow: hidden;
}
.meta .sources { overflow: hidden; text-overflow: ellipsis; }
.meta .asof, .meta .disclaimer { flex: none; }

.draft-badge {
  position: absolute; top: 120px; right: 40px; padding: 10px 22px;
  transform: rotate(4deg);
  background: #d62828; color: #fff; font-size: 30px; font-weight: 900;
  border: 4px solid #fff; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.35);
}
.safe-zone {
  position: absolute; left: 0; right: 0; top: var(--safe-top); bottom: 0;
  pointer-events: none;
}
.safe-zone.debug { background: repeating-linear-gradient(45deg, rgba(255,0,0,.12) 0 20px, transparent 20px 40px); }
.mascot {
  position: absolute; right: 48px; bottom: 24px;
  max-width: 280px; max-height: 230px; object-fit: contain;
}

/* ---- layouts ---------------------------------------------------------- */
/* Body blocks sit centred in the space left under the heading. */
.content > .bullets, .content > .compare, .content > .timeline { margin-top: auto; margin-bottom: auto; }

.layout-title .content { justify-content: center; }
.layout-title .title-main {
  font-family: var(--font-heading, var(--font-sans));
  font-size: 104px; font-weight: 900; line-height: 1.15;
}
.layout-title .title-sub { margin-top: 36px; font-size: 44px; color: var(--muted); }
.layout-title .title-rule { width: 200px; height: 12px; margin-top: 40px; background: var(--accent); border-radius: 6px; }

.bullets { list-style: none; display: flex; flex-direction: column; gap: 30px; counter-reset: b; }
.bullets li {
  counter-increment: b; display: flex; align-items: baseline; gap: 28px;
  font-size: 54px; font-weight: 700; line-height: 1.3;
}
.bullets li::before {
  content: counter(b, decimal-leading-zero); flex: none;
  font-family: var(--font-mono); font-size: 40px; color: var(--accent);
}

.bignum { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.bignum .value-row { display: flex; align-items: baseline; gap: 24px; white-space: nowrap; }
.bignum .value {
  font-family: var(--font-number, var(--font-sans)); font-size: 240px; font-weight: 900;
  line-height: 1; color: var(--accent); letter-spacing: -0.02em;
}
.bignum .unit { font-size: 88px; font-weight: 700; }
.bignum .caption { margin-top: 28px; font-size: 46px; color: var(--muted); line-height: 1.35; }

.compare { display: grid; grid-template-columns: 1fr 96px 1fr; align-items: stretch; }
.compare .side { background: var(--card); border-radius: 24px; padding: 36px 44px; border-top: 10px solid var(--accent); }
.compare .side.right { border-top-color: var(--accent-2); }
.compare .label { font-size: 48px; font-weight: 900; margin-bottom: 24px; }
.compare ul { list-style: none; display: flex; flex-direction: column; gap: 18px; }
.compare li { font-size: 40px; line-height: 1.3; }
.compare li::before { content: "▸ "; color: var(--muted); }
.compare .vs { align-self: center; text-align: center; font-family: var(--font-mono); font-size: 44px; font-weight: 900; color: var(--muted); }

.timeline { position: relative; display: flex; align-items: stretch; padding-top: 24px; }
.timeline::before {
  content: ""; position: absolute; left: 0; right: 0; top: 112px; height: 6px;
  background: var(--rule); border-radius: 3px;
}
.timeline .event { flex: 1; position: relative; padding: 0 14px; }
.timeline .when {
  height: 72px; font-family: var(--font-number, var(--font-mono)); font-size: 44px;
  font-weight: 900; color: var(--accent); white-space: nowrap;
}
.timeline .dot {
  width: 30px; height: 30px; margin: 4px 0 30px; border-radius: 50%;
  background: var(--accent); border: 6px solid var(--bg); box-shadow: 0 0 0 3px var(--accent);
}
.timeline .what { font-size: 36px; line-height: 1.35; }

.quote { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 60px; }
.quote .mark { font-family: var(--font-heading, serif); font-size: 200px; line-height: 0.6; color: var(--accent); }
.quote .text { font-family: var(--font-heading, var(--font-sans)); font-size: 66px; font-weight: 700; line-height: 1.4; }
.quote .who { margin-top: 36px; font-size: 38px; color: var(--muted); }
.quote .who::before { content: "— "; }

/* tech — 台灣科技產業拆解 (MVP default): charcoal, orange accent, mono numbers. */
:root {
  --bg: #15171c;
  --fg: #f2f2f0;
  --muted: #9aa0a8;
  --rule: #2d3139;
  --card: #1e2128;
  --accent: #ff8a1f;
  --accent-2: #4cc9f0;
  --font-number: "SF Mono", "Menlo", monospace;
}
body {
  /* faint blueprint grid + warm glow, drawn over --bg */
  background-image:
    radial-gradient(1200px 600px at 100% 0%, rgba(255, 138, 31, 0.08), transparent 60%),
    linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
  background-size: auto, 48px 48px, 48px 48px;
}

</style>
