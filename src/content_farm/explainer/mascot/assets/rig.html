<!doctype html>
<!--
  晶片貓 rig (Route A vector redraw) — a layered SVG puppet driven by
  Live2D-style parameters (mascot/params.py).

  The page is a pure function of the last applyParams() call: no CSS
  animations, transitions or timers, so a frame captured after applyParams()
  depends only on its parameters (deterministic clock lives in Python).

  Canvas 620x540, transparent. Cat-local coordinates are a 400x440 box placed
  at (240,100); the floor anchor is (200,410). Design source:
  docs/design/mascot-quality/route-a-vector/ on design/mascot-quality.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 620px; height: 540px; background: transparent; overflow: hidden; }
  #stage { position: relative; width: 620px; height: 540px; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #bubble {
    position: absolute; right: 262px; bottom: 330px; max-width: 330px;
    padding: 12px 22px; box-sizing: border-box;
    background: #ffffff; color: #222a3f; border: 4px solid #222a3f; border-radius: 22px;
    font: 700 30px/1.3 "PingFang TC", "Noto Sans CJK TC", "Heiti TC", sans-serif;
    white-space: pre-wrap; word-break: break-all; opacity: 0; transform-origin: 100% 100%;
    box-shadow: 0 6px 14px rgba(0,0,0,.28);
  }
  #bubble::after {
    content: ""; position: absolute; right: -22px; bottom: 6px;
    border-style: solid; border-width: 12px 0 12px 24px;
    border-color: transparent transparent transparent #222a3f;
  }
  #bubble::before {
    content: ""; position: absolute; right: -14px; bottom: 10px; z-index: 1;
    border-style: solid; border-width: 8px 0 8px 16px;
    border-color: transparent transparent transparent #ffffff;
  }
</style>
</head>
<body>
<div id="stage">
<svg width="620" height="540" viewBox="0 0 620 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- sticker look: navy outer line, light rim (reads on dark themes), soft drop shadow -->
    <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="line"/>
      <feFlood flood-color="#222a3f"/><feComposite in2="line" operator="in" result="outline"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="rimA"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.4"/><feComposite in2="rimA" operator="in" result="rim"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/><feOffset in="b" dy="6" result="o"/>
      <feFlood flood-color="#000" flood-opacity="0.28"/><feComposite in2="o" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="rim"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="iris" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#ffd877"/><stop offset="0.55" stop-color="#f4a93a"/><stop offset="1" stop-color="#d9711f"/>
    </radialGradient>
    <path id="bodyPath" d="M200,234 C150,234 116,272 108,322 C100,370 112,406 152,410 L248,410 C288,406 300,370 292,322 C284,272 250,234 200,234 Z"/>
    <path id="headPath" d="M200,74 C264,74 314,110 318,160 C320,180 316,194 330,206 C318,212 318,224 324,232 C304,236 292,248 268,254 C248,259 226,261 200,261 C174,261 152,259 132,254 C108,248 96,236 76,232 C82,224 82,212 70,206 C84,194 80,180 82,160 C86,110 136,74 200,74 Z"/>
    <clipPath id="bodyClip"><use href="#bodyPath"/></clipPath>
    <clipPath id="headClip"><use href="#headPath"/></clipPath>
    <clipPath id="eyeClipL"><ellipse cx="150" cy="176" rx="29.6" ry="32.6"/></clipPath>
    <clipPath id="eyeClipR"><ellipse cx="250" cy="176" rx="29.6" ry="32.6"/></clipPath>
    <g id="legShape">
      <rect x="-10" y="-19" width="118" height="38" rx="19" fill="#c7d2e2" stroke="#222a3f" stroke-width="4.5"/>
      <ellipse cx="92" cy="0" rx="22" ry="21" fill="#f8f5ef" stroke="#222a3f" stroke-width="4"/>
    </g>
  </defs>

  <g id="cat" filter="url(#sticker)" transform="translate(240 100)">
    <g id="tail">
      <path id="tailO" fill="none" stroke="#222a3f" stroke-width="34" stroke-linecap="round"/>
      <path id="tailF" fill="none" stroke="#c7d2e2" stroke-width="25" stroke-linecap="round"/>
      <path id="tailS" fill="none" stroke="#6c7c9a" stroke-width="25" stroke-dasharray="8 22" stroke-dashoffset="-40"/>
    </g>
    <g id="body">
      <use href="#bodyPath" fill="#c7d2e2" stroke="#222a3f" stroke-width="4.5" stroke-linejoin="round"/>
      <g clip-path="url(#bodyClip)">
        <ellipse cx="306" cy="330" rx="56" ry="120" fill="#9eadc5"/>
        <ellipse cx="200" cy="338" rx="50" ry="70" fill="#f8f5ef"/>
        <ellipse cx="200" cy="252" rx="86" ry="22" fill="#9eadc5"/>
        <path d="M118,300 L138,300 L146,292 M282,300 L262,300 L254,292" fill="none" stroke="#6c7c9a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <use href="#legShape" transform="translate(234 304) rotate(86)"/>
    </g>
    <g id="collar">
      <path d="M136,252 Q200,278 264,252 L263,264 Q200,290 137,264 Z" fill="#1f9f96" stroke="#222a3f" stroke-width="4" stroke-linejoin="round"/>
      <g id="chip">
        <g stroke="#f2b23e" stroke-width="3.2" stroke-linecap="round"><path d="M181,281 L176,281 M219,281 L224,281 M181,289 L176,289 M219,289 L224,289 M181,297 L176,297 M219,297 L224,297"/></g>
        <rect x="181" y="274" width="38" height="31" rx="6" fill="#222a3f"/>
        <rect x="191" y="281" width="18" height="17" rx="3" fill="#f2b23e"/>
        <path d="M194,285 L201,285" stroke="#fff4cf" stroke-width="2.4" stroke-linecap="round"/>
      </g>
    </g>
    <!-- right foreleg / pointing paw (shoulder 166,304); 94° = resting, 196° = pointing left -->
    <g id="armR">
      <use href="#legShape"/>
      <g id="beans" fill="#f3a3b1" visibility="hidden">
        <ellipse cx="82" cy="0" rx="10" ry="12"/><circle cx="97" cy="-12" r="4.6"/><circle cx="101" cy="0" r="4.6"/><circle cx="97" cy="12" r="4.6"/>
      </g>
    </g>
    <g id="head">
      <g id="earL"><path d="M98,140 C88,98 90,60 104,36 Q110,28 118,34 C140,52 158,72 172,94 Z" fill="#c7d2e2" stroke="#222a3f" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M110,122 C104,94 106,68 114,52 C130,66 144,82 154,96 Z" fill="#f3a3b1"/></g>
      <g id="earR"><path d="M302,140 C312,98 310,60 296,36 Q290,28 282,34 C260,52 242,72 228,94 Z" fill="#c7d2e2" stroke="#222a3f" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M290,122 C296,94 294,68 286,52 C270,66 256,82 246,96 Z" fill="#f3a3b1"/></g>
      <use href="#headPath" fill="#c7d2e2" stroke="#222a3f" stroke-width="4.5" stroke-linejoin="round"/>
      <g clip-path="url(#headClip)">
        <ellipse cx="200" cy="262" rx="120" ry="26" fill="#9eadc5" opacity="0.7"/>
        <!-- signature: forehead tabby "M" drawn as circuit traces ending in gold vias -->
        <g id="marks"><path d="M200,78 L200,110 M176,80 L176,94 L166,104 L166,116 M224,80 L224,94 L234,104 L234,116 M76,176 L100,176 L108,168 M80,192 L102,192 M324,176 L300,176 L292,168 M320,192 L298,192"
          fill="none" stroke="#6c7c9a" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <g fill="#f2b23e" stroke="#222a3f" stroke-width="2.4"><circle cx="200" cy="115" r="5.6"/><circle cx="166" cy="121" r="5.6"/><circle cx="234" cy="121" r="5.6"/></g></g>
      </g>
      <g id="face">
        <g id="blush" fill="#f3a3b1"><ellipse cx="124" cy="216" rx="16" ry="9"/><ellipse cx="276" cy="216" rx="16" ry="9"/></g>
        <ellipse cx="186" cy="216" rx="19" ry="13" fill="#f8f5ef"/><ellipse cx="214" cy="216" rx="19" ry="13" fill="#f8f5ef"/>
        <g id="eyeL"></g>
        <g id="eyeR"></g>
        <path d="M191,204 Q200,199 209,204 Q205,213 200,214 Q195,213 191,204 Z" fill="#e57e95" stroke="#222a3f" stroke-width="2.6" stroke-linejoin="round"/>
        <g id="mouth"></g>
        <path d="M118,222 L80,214 M118,230 L82,236 M282,222 L320,214 M282,230 L318,236" stroke="#222a3f" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
      </g>
      <!-- effects ride on the head, outside the sticker outline's reach of the face -->
      <path id="sweat" d="M334,120 C324,138 322,150 334,152 C346,150 344,138 334,120 Z" fill="#8fd3ff" stroke="#222a3f" stroke-width="3" visibility="hidden"/>
      <g id="burst" stroke="#f2b23e" stroke-width="6" stroke-linecap="round" visibility="hidden">
        <path d="M60,64 L42,46 M86,40 L78,16 M340,64 L358,46 M314,40 L322,16"/>
      </g>
    </g>
  </g>
</svg>
<div id="bubble"></div>
</div>
<script>
(() => {
  const q = (s) => document.querySelector(s);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const f = (v) => v.toFixed(2);
  const show = (el, on) => el.setAttribute('visibility', on ? 'visible' : 'hidden');
  const NAVY = '#222a3f', BASE = '#c7d2e2';
  // Placement: the 400x440 cat box sits at (CAT_X, CAT_Y), scaled about its floor
  // anchor so every pose keeps its pixels right of the subtitle band (overlay.py).
  const CAT_X = 266, CAT_Y = 94, CAT_SCALE = 0.86, POINT_DEG = 210, ARM_REACH = 22;
  const els = { cat: q('#cat'), body: q('#body'), head: q('#head'), face: q('#face'), marks: q('#marks'),
    earL: q('#earL'), earR: q('#earR'), eyeL: q('#eyeL'), eyeR: q('#eyeR'), mouth: q('#mouth'),
    armR: q('#armR'), beans: q('#beans'), chip: q('#chip'), collar: q('#collar'), blush: q('#blush'),
    sweat: q('#sweat'), burst: q('#burst'),
    tail: [q('#tailO'), q('#tailF'), q('#tailS')], bubble: q('#bubble') };
  let lastSay = null;

  // Eye: navy ring, gradient iris, slit pupil (dilates with ParamPupil), two highlights.
  // Upper lid slides down with (1 - open) and bows like a heavy eyelid; lower lid
  // rises as an upward arc with smile. open > 1 widens the whole eye.
  function eyeSvg(cx, open, smile, bx, by, pupil, clipId) {
    const cy = 176;
    if (open <= 0.08) {
      return `<path d="M${cx - 26},${cy + 2} Q${cx},${cy + 16} ${cx + 26},${cy + 2}" fill="none" stroke="${NAVY}" stroke-width="6" stroke-linecap="round"/>`;
    }
    const gx = bx * 7, gy = by * 6;
    const k = 1 + Math.max(0, open - 1) * 0.6;
    let s = `<g transform="translate(${cx} ${cy}) scale(${f(k)}) translate(${-cx} ${-cy})">`
      + `<ellipse cx="${cx}" cy="${cy}" rx="28" ry="31" fill="${NAVY}"/>`
      + `<g clip-path="url(#${clipId})">`
      + `<ellipse cx="${f(cx + gx)}" cy="${f(cy + gy)}" rx="22" ry="25" fill="url(#iris)"/>`
      + `<ellipse cx="${f(cx + gx * 1.2)}" cy="${f(cy + gy + 1)}" rx="${f(6 + 9 * pupil)}" ry="${f(17 - 3 * pupil)}" fill="${NAVY}"/>`
      + `<circle cx="${f(cx + gx - 9)}" cy="${f(cy + gy - 12)}" r="8" fill="#fff"/>`
      + `<circle cx="${f(cx + gx + 9)}" cy="${f(cy + gy + 11)}" r="3.6" fill="#fff"/>`;
    const shut = clamp(1 - open, 0, 1);
    if (shut > 0.02) {
      const y = cy - 31 + 62 * shut, sag = 5 * Math.min(1, shut * 3);
      const edge = `M${cx - 34},${f(y)} Q${cx},${f(y + sag)} ${cx + 34},${f(y)}`;
      s += `<path d="${edge} L${cx + 34},${cy - 40} L${cx - 34},${cy - 40} Z" fill="${BASE}"/>`
        + `<path d="${edge}" fill="none" stroke="${NAVY}" stroke-width="7"/>`;
    }
    const sm = clamp(smile, 0, 1);
    if (sm > 0.02) {
      const y0 = cy + 31 - 22 * sm, top = y0 - 16 * sm;
      s += `<path d="M${cx - 34},${cy + 40} L${cx - 34},${f(y0 + 6)} Q${cx},${f(top)} ${cx + 34},${f(y0 + 6)} L${cx + 34},${cy + 40} Z" fill="${BASE}"/>`
        + `<path d="M${cx - 34},${f(y0 + 6)} Q${cx},${f(top)} ${cx + 34},${f(y0 + 6)}" fill="none" stroke="${NAVY}" stroke-width="6"/>`;
    }
    return s + '</g></g>';
  }

  // Mouth: open shape is continuous in ParamMouthOpenY (depth and width both grow,
  // so lip-sync has no visible steps); closed forms are ω / flat / smirk / O.
  function mouthSvg(openY, form, oShape) {
    if (openY >= 0.08) {
      const o = clamp(openY, 0, 1), d = 222 + 26 * o, w = 12 + 4 * o;
      return `<path d="M${f(200 - w)},220 Q200,226 ${f(200 + w)},220 Q${f(199 + w)},${f(d)} 200,${f(d + 2)} Q${f(201 - w)},${f(d)} ${f(200 - w)},220 Z" fill="#6e2236" stroke="${NAVY}" stroke-width="3.2" stroke-linejoin="round"/>`
        + `<ellipse cx="200" cy="${f(d - 4)}" rx="${f(5 + 3 * o)}" ry="4" fill="#f0899b"/>`;
    }
    if (oShape > 0.5) return `<ellipse cx="200" cy="228" rx="7" ry="8.5" fill="#6e2236" stroke="${NAVY}" stroke-width="3"/>`;
    if (form <= -0.5) return `<path d="M188,224 L212,224" stroke="${NAVY}" stroke-width="3.6" stroke-linecap="round"/>`;
    if (form >= 0.5) return `<path d="M184,222 Q200,230 218,214" fill="none" stroke="${NAVY}" stroke-width="3.6" stroke-linecap="round"/>`;
    return `<path d="M184,219 Q192,229 200,220 Q208,229 216,219" fill="none" stroke="${NAVY}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  }

  function tail(t1, t2, puff) {
    const d = `M262,394 C314,396 ${f(340 + 10 * t1)},352 ${f(330 + 16 * t1)},304 `
      + `C${f(324 + 20 * t1)},276 ${f(308 + 26 * t2)},${f(262 - 4 * t2)} ${f(294 + 30 * t2)},${f(268 - 6 * t2)}`;
    const k = 1 + 0.4 * clamp(puff, 0, 1);
    [34, 25, 25].forEach((w, i) => { els.tail[i].setAttribute('d', d); els.tail[i].setAttribute('stroke-width', f(w * k)); });
  }

  window.applyParams = (p, say) => {
    const ax = p.ParamAngleX, ay = p.ParamAngleY, az = p.ParamAngleZ, br = p.ParamBreath;
    els.cat.setAttribute('transform', `translate(${f(CAT_X + p.ParamBodyX)} ${f(CAT_Y + p.ParamBodyY)}) `
      + `translate(200 410) scale(${CAT_SCALE}) translate(-200 -410) rotate(${f(p.ParamBodyAngleX)} 200 410)`);
    els.body.setAttribute('transform', `translate(200 410) scale(${f(1 + 0.006 * br)} ${(1 + 0.018 * br).toFixed(4)}) translate(-200 -410)`);
    els.collar.setAttribute('transform', `translate(0 ${f(-br * 4)})`);
    els.chip.setAttribute('transform', `rotate(${f(p.ParamChip)} 200 268)`);
    els.head.setAttribute('transform', `translate(${f(ax * 0.5)} ${f(ay * 0.45 - br * 5)}) rotate(${f(az)} 200 250)`);
    els.face.setAttribute('transform', `translate(${f(ax * 0.6)} ${f(ay * 0.4)})`);
    els.marks.setAttribute('transform', `translate(${f(ax * 0.3)} ${f(ay * 0.2)})`);
    els.earL.setAttribute('transform', `translate(${f(-ax * 0.1)} 0) rotate(${f(-p.ParamEarL)} 128 104)`);
    els.earR.setAttribute('transform', `translate(${f(-ax * 0.1)} 0) rotate(${f(p.ParamEarR)} 272 104)`);
    els.eyeL.innerHTML = eyeSvg(150, p.ParamEyeLOpen, p.ParamEyeLSmile, p.ParamEyeBallX, p.ParamEyeBallY, p.ParamPupil, 'eyeClipL');
    els.eyeR.innerHTML = eyeSvg(250, p.ParamEyeROpen, p.ParamEyeRSmile, p.ParamEyeBallX, p.ParamEyeBallY, p.ParamPupil, 'eyeClipR');
    els.mouth.innerHTML = mouthSvg(p.ParamMouthOpenY, p.ParamMouthForm, p.ParamMouthO);
    // a flat mouth (deadpan) drains the blush; a smirk or smile keeps it
    els.blush.setAttribute('opacity', f(0.55 * clamp(1 + p.ParamMouthForm, 0, 1)));
    const raise = clamp(p.ParamArmR / 1.1, 0, 1);
    els.armR.setAttribute('transform', `translate(166 304) rotate(${f(94 + (POINT_DEG - 94) * raise + p.ParamArmRWave)}) `
      + `translate(${f(ARM_REACH * raise)} 0)`);  // raised paw also reaches out of the body
    show(els.beans, raise > 0.55);
    tail(p.ParamTail, p.ParamTail2, p.ParamTailPuff);
    const sw = clamp(p.ParamSweat || 0, 0, 1);
    show(els.sweat, sw > 0.02);
    els.sweat.setAttribute('opacity', f(sw));
    els.sweat.setAttribute('transform', `translate(0 ${f(-14 * (1 - sw))})`);
    const bu = clamp(p.ParamBurst || 0, 0, 1);
    show(els.burst, bu > 0.02);
    els.burst.setAttribute('opacity', f(bu));
    const b = clamp(p.ParamBubble, 0, 1);
    if (say !== lastSay) { els.bubble.textContent = say || ''; lastSay = say; }
    els.bubble.style.opacity = say ? b.toFixed(3) : '0';
    els.bubble.style.transform = `scale(${(0.85 + 0.15 * b).toFixed(3)})`;
  };
})();
</script>
</body>
</html>
